[project]
name = "fontype-engine"
version = "0.1.0"
description = "Local font engineering worker for FONTYPE"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fonttools",
  "ufoLib2",
  "fontmake",
  "uharfbuzz",
  "defusedxml",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fontype_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
